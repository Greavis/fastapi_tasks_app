<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/styles.css">
    <title>taskflow</title>
</head>
<body>
    <div class="wrapper">
        <aside class="menu">
            <img src="###" alt="">
            <ol class="side_menu">
                <li class="menu_item"><a href="#">Task List</a></li>
                <li class="menu_item"><a href="#">Manage</a></li>
                <li class="menu_item"><a href="#">Settings</a></li>
                <li class="menu_item"><a href="#">Support</a></li>
            </ol>
            <a href="" class="logout_btn">Sign Out</a>
        </aside>
        <div class="content">
            <div class="content_header">
                <input type="text" class="search">
                <div class="profile_info">
                    <div class="notify_btn"></div>
                    <div class="profile_img"></div>
                </div>
            </div>

            <div class="tasks">
                <div class="tasks_header">
                    <h3 class="tasks_title">Tasks</h3>
                    <div class="tasks_count">328 Total</div>
                </div>
                <table class="tasks_table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Priority</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Task 3</td>
                            <td>Open</td>
                            <td>High</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Fix a bug</td>
                            <td>In Progress</td>
                            <td>Medium</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Kill Bill</td>
                            <td>Done</td>
                            <td>Low</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
